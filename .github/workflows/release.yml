name: Release & Auto Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Dungeons & Dynasties Save Editor ${{ github.ref_name }}'
          releaseBody: |
            ## 🛡️ Dungeons & Dynasties Save Game Editor ${{ github.ref_name }}

            ### ✨ What's New in v1.1.0:
            - **⚔️ Party Synergy Planner**: Live evaluation of all 11 official class synergies with party damage, healing, and mitigation calculation, active/inactive synergy views, and 4-hero squad auto-recommender.
            - **🧭 Dungeon Condition Scout**: Full hazard reconnaissance for Flooded, Pitch Dark, Cursed Ground, Deep Cold, Infernal Heat, and Numbing Frost. Scans active counter gear & traits across roster and stash, offering readiness grading and squad deployment.
            - **🛡️ Datamined Equipment Forge & Vault Editor**: Complete loot generation engine from v3.0.0 datamine:
              - 4 Rarity Tiers (Common 80%, Rare 16%, Mythic 3.5%, Legendary 0.5%)
              - 7 Quality Band Multipliers (Cursed x-1.0, Flawed x0.55, Worn x0.75, Potent x1.0, Vaunted x1.25, Exalted x1.45, Sovereign x1.80)
              - 11 Trait-granting Relic gear items (Lone Wolf, Reckless, Stalwart, Brave, Iron-Willed, Arrogant, Greedy)
              - 6 Environmental condition counter items
              - 24 Minor Trinkets catalog
              - Curated combat stat selectors with human-readable descriptions
              - 5 Role-based stat presets (DPS, Tank, Healer, Assassin, Sovereign God-Roll)
            - **✨ Expanded 110-Trait Database**: Datamined combat behavior parameters (courage, recklessness, threatMult, luck) and nonCombat event details.
            - **🎯 Role-Based Trait Recommendations**: Suggested traits and 1-click optimal builds for Tanks, DPS, and Healers with counterproductive flaw warnings.
            - **🎒 Guild Vault Equipment Integration**: Delvers can equip items directly from the vault in Hero Modal.
            - **🐛 Bug Fixes & Refinements**:
              - Fixed Unix epoch timestamp display (1970 bug) in save backup manager.
              - Full 8-language localization across all new views and modals (EN, ID, ZH, DE, JA, ES, RU, FR).
              - Offline embedded production assets for standalone desktop execution.

            ### 📦 Installers & Update Manifest:
            - **Windows NSIS Setup**: `dndeditor_${{ github.ref_name }}_x64-setup.exe`
            - **Windows MSI Installer**: `dndeditor_${{ github.ref_name }}_x64_en-US.msi`
            - **Auto-Updater Manifest**: `latest.json` + signature bundle
          releaseDraft: false
          prerelease: false

